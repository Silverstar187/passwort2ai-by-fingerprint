name: Shellcheck

# Lints all bash scripts on every push + PR.
# bin/p2ai is the main wrapper; install.sh + tests/security.sh are also bash.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          # severity=error: only fail on real bugs (syntax, undefined vars in
          # nounset shells, etc.). Style warnings tracked separately, not
          # release-blocking. Run locally with --severity=warning for cleanup.
          severity: error
          scandir: '.'
          additional_files: 'bin/p2ai'
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC1091
